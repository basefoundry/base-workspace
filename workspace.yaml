schema_version: 1

workspace:
  name: base-local

repos:
  - name: base
    url: git@github.com:basefoundry/base.git
    default_branch: main
    required: true

  - name: base-bash-libs
    url: git@github.com:basefoundry/base-bash-libs.git
    default_branch: main
    required: true

  - name: base-cli
    url: git@github.com:basefoundry/base-cli.git
    default_branch: main
    required: true

  - name: base-workspace
    url: git@github.com:basefoundry/base-workspace.git
    default_branch: main
    required: true

  - name: base-demo
    url: https://github.com/basefoundry/base-demo.git
    default_branch: main
    required: false

  - name: base-cli-demo
    url: https://github.com/basefoundry/base-cli-demo.git
    default_branch: main
    required: false

  - name: base-bash-libs-demo
    url: https://github.com/basefoundry/base-bash-libs-demo.git
    default_branch: main
    required: false
